name: Deploy to GitHub Pages
# redeploy-trigger: 2026-09-08

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0
        with:
          enablement: true

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p gh-pages/developers gh-pages/get-started gh-pages/share
          cp public/index.html gh-pages/
          cp public/developers.html gh-pages/
          cp public/developers/index.html gh-pages/developers/
          cp public/get-started.html gh-pages/
          cp public/get-started/index.html gh-pages/get-started/
          cp public/styles.css gh-pages/
          cp public/script.js gh-pages/
          cp public/logo.png gh-pages/
          cp public/lemuel.png gh-pages/
          cp public/og-image.png gh-pages/
          cp public/banner.png gh-pages/
          cp public/share/alicegardner.png gh-pages/share/
          cp public/CNAME gh-pages/
          cp public/.htaccess gh-pages/
          cp public/robots.txt gh-pages/
          cp public/sitemap.xml gh-pages/
          cp public/favicon.ico gh-pages/
          cp public/favicon-*.png gh-pages/
          cp public/site.webmanifest gh-pages/
          cp public/browserconfig.xml gh-pages/
          touch gh-pages/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './gh-pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
# redeploy trigger 2026-09-08
